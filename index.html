<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!-- maximum-scale/user-scalable: the app owns zoom, not the browser. Only the
         asset image viewer zooms, and it does it itself. iOS Safari ignores both
         of these - see src/lib/disable-page-zoom.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121113" />
    <!-- iOS ignores the manifest for these three -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SCPP" />
    <!-- black-translucent lets the app paint under the status bar; the mobile
         header already pads itself with env(safe-area-inset-top). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SCPP Web Application</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
